name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Render to a staging file, never to README.md directly. The metrics
      # action writes its output file even when it fails — a failed run writes
      # a GitHub API error string instead of the real README. Writing to
      # README.md.tmp means a bad render can never touch the committed file.
      #
      # NOTE: the metrics action decides whether to pull its prebuilt Docker
      # image or rebuild from its Dockerfile by inspecting `github.action`
      # (the step id, or the `uses` value when there is no id). The step must
      # have NO `id` and no `name` that contains "metrics" — otherwise the
      # action thinks it is a fork and rebuilds the image locally, which fails
      # (the Dockerfile is missing xz-utils and `gem install licensed` aborts
      # on `xzcat not found`). No id + no name keeps the official path.
      - name: Render profile (staging)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          template: markdown
          markdown: https://raw.githubusercontent.com/lianbeast/lianbeast/main/.github/metrics.profile.md
          filename: README.md.tmp
          markdown_cache: .cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_isocalendar_duration: "year"
          plugin_languages: "1"
          plugin_languages_details: "percentage, bytes-size"
          # plugin_lines disabled — metrics bug: TypeError: Cannot read properties of null (reading 'login')
          # plugin_skyline disabled — Puppeteer times out in GitHub Actions
          output_action: "none"

      - name: Validate and publish
        if: always()
        run: |
          set -e
          if [ -f README.md.tmp ] && grep -q "Lian Beast" README.md.tmp && ! grep -qi "did not provide a valid" README.md.tmp; then
            mv README.md.tmp README.md
          else
            echo "Metrics render failed or produced invalid output — leaving the committed README untouched."
            rm -f README.md.tmp
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[skip ci] Update GitHub metrics" || echo "Nothing to commit"
          git push
