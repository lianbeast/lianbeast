name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure cache directory exists
        run: mkdir -p .cache

      - name: Render profile (staging)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          template: markdown
          markdown: https://raw.githubusercontent.com/lianbeast/lianbeast/main/.github/metrics.profile.md
          filename: README.md.tmp
          markdown_cache: .cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_isocalendar_duration: "year"
          plugin_languages: "1"
          plugin_languages_details: "percentage, bytes-size"
          output_action: "none"

      # With output_action: "none" the metrics action rewrites every cacheable
      # <img> to a github.com blob URL but never writes the file — it only saves
      # the rendered markdown to the runner mount. Fetch each blob through the
      # API, materialise it in .cache/, and point the <img> at the raw URL
      # GitHub renders inline.
      - name: Materialise cached metrics images
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/workflows/metrics.cache.py

      - name: Validate and publish
        if: always()
        run: |
          set -e
          if [ -f README.md.tmp ] && grep -q "Lian Beast" README.md.tmp && ! grep -qi "did not provide a valid" README.md.tmp; then
            mv README.md.tmp README.md
            git add README.md .cache/
            git commit -m "[skip ci] Update GitHub metrics" || echo "Nothing to commit"
            git push
          else
            echo "Metrics render failed or produced invalid output — leaving the committed README untouched."
            rm -f README.md.tmp
            exit 0
          fi
