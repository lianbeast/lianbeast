name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure cache directory exists
        run: mkdir -p .cache

      - name: Render profile (staging)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lianbeast
          template: markdown
          markdown: https://raw.githubusercontent.com/lianbeast/lianbeast/main/.github/metrics.profile.md
          filename: README.md.tmp
          markdown_cache: .cache
          config_timezone: "UTC"
          plugin_isocalendar: "1"
          plugin_isocalendar_duration: "year"
          plugin_languages: "1"
          plugin_languages_details: "percentage, bytes-size"
          output_action: "none"

      - name: Fix image URLs
        run: |
          # Replace blob URLs with raw URLs for proper inline rendering
          sed -i 's|https://github.com/lianbeast/lianbeast/blob/main/\.cache/|https://raw.githubusercontent.com/lianbeast/lianbeast/main/.cache/|g' README.md.tmp
          # Fix avatar URL
          sed -i 's|https://github.com/lianbeast?avatar=1|https://avatars.githubusercontent.com/lianbeast?s=240\&v=4|g' README.md.tmp

      - name: Validate and publish
        if: always()
        run: |
          set -e
          if [ -f README.md.tmp ] && grep -q "Lian Beast" README.md.tmp && ! grep -qi "did not provide a valid" README.md.tmp; then
            mv README.md.tmp README.md
            # Commit both README and cache directory
            git add README.md .cache/
            git commit -m "[skip ci] Update GitHub metrics" || echo "Nothing to commit"
            git push
          else
            echo "Metrics render failed or produced invalid output — leaving the committed README untouched."
            rm -f README.md.tmp
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
